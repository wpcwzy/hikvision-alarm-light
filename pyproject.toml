[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hikvision-alarm-light"
version = "1.7.0"
description = "Home Assistant: Hikvision NVR intrusion alarm triggers camera white light"
requires-python = ">=3.12"
dependencies = ["requests>=2.28"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
